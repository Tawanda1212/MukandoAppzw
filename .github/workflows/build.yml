name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create . --project-name mukandoappzw

      - name: Fix Dart SDK constraint
        run: |
          if ! grep -q "^environment:" pubspec.yaml; then
            printf "\nenvironment:\n  sdk: '^3.13.0'\n" >> pubspec.yaml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mukandoappzw-apk
          path: build/app/outputs/flutter-apk/app-release.apk
